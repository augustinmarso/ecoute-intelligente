name: Probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: pip install -U yt-dlp
      - run: |
          for c in default tv_simply web_embedded mweb tv ios android_vr web_safari; do
            if [ "$c" = default ]; then A=""; else A="--extractor-args youtube:player_client=$c"; fi
            if yt-dlp $A --skip-download --print title "https://www.youtube.com/watch?v=arj7oStGLkU" >/dev/null 2>err.txt; then echo "OK $c"; else echo "KO $c: $(head -c 120 err.txt)"; fi
          done
