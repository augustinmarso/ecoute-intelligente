# Site en ligne (GitHub Pages) + préparation des vidéos.
# Ajouter une vidéo : bouton « Préparer » du site (ouvre une issue pré-remplie, réservée au propriétaire),
# ou onglet Actions → « Site » → Run workflow → coller le lien YouTube.
name: Site

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      video:
        description: "Lien (ou ID) de la vidéo YouTube à ajouter — vide = republier le site"
        required: false
  issues:
    types: [opened]

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  prepare:
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.video != '') || (github.event_name == 'issues' && github.event.issue.user.login == github.repository_owner && startsWith(github.event.issue.title, 'Préparer')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --omit=dev
      - run: pip install -U yt-dlp
      - name: Préparer la vidéo
        env:
          VIDEO: ${{ inputs.video || github.event.issue.title }}
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: |
          if [ -n "$YT_COOKIES" ]; then printf '%s\n' "$YT_COOKIES" > "$RUNNER_TEMP/cookies.txt"; export YTDLP_COOKIES="$RUNNER_TEMP/cookies.txt"; fi
          node scripts/prepare-video.js "$VIDEO"
      - name: Enregistrer dans le dépôt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/videos
          git commit -m "Vidéo ajoutée : $VIDEO" || exit 0
          git pull --rebase
          git push
        env:
          VIDEO: ${{ inputs.video || github.event.issue.title }}
      - name: Fermer l'issue
        if: ${{ always() && github.event_name == 'issues' }}
        env:
          GH_TOKEN: ${{ github.token }}
          OK: ${{ job.status }}
          NUM: ${{ github.event.issue.number }}
        run: |
          if [ "$OK" = success ]; then MSG="Vidéo prête, elle s'ouvre sur le site dans 1 minute."
          else MSG="Échec de la préparation (vidéo sans sous-titres anglais ? cookies YouTube expirés ?) : voir les logs Actions."; fi
          gh issue close "$NUM" -R "$GITHUB_REPOSITORY" -c "$MSG"

  deploy:
    needs: prepare
    if: ${{ !cancelled() && needs.prepare.result != 'failure' && (github.event_name != 'issues' || needs.prepare.result == 'success') }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
